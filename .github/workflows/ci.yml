name: CI

# Compila la app en cada Pull Request para detectar fallos antes de mergear
# y deja el resultado (dist/) como artefacto descargable para revisar el contenido.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build (dist)
        uses: actions/upload-artifact@v4
        with:
          name: dist-pr-${{ github.event.pull_request.number || github.run_id }}
          path: dist
          retention-days: 14
